[project]
name = "pdf-ai-engine"
version = "0.2.0"
description = "8848 PDF AI -- headless, deterministic PDF redaction and layout-preserving text-replacement engine"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "webui"]

[tool.pytest.ini_options]
pythonpath = ["."]
