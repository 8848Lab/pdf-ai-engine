[project]
name = "pdf-ai-engine"
version = "0.1.0"
description = "8848 PDF AI -- headless, deterministic PDF redaction engine (v0.1)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]
