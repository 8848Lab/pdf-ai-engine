[project]
name = "pdf-ai-engine"
version = "0.2.0"
description = "8848 PDF AI -- headless, deterministic PDF redaction and layout-preserving text-replacement engine"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
